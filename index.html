<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" id="theme-color" content="#f6f5f3" />
  <script>
    // Apply the saved theme (or the phone's setting) before first paint.
    (function () {
      var t = null;
      try { t = JSON.parse(localStorage.getItem("usafl.theme")); } catch (e) {}
      if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = t;
      document.getElementById("theme-color").content = t === "dark" ? "#0e0d0c" : "#f6f5f3";
    })();
  </script>
  <title>USAFL Umpires — Nationals 2026</title>

  <!-- Installable PWA -->
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />

  <!-- iOS: add-to-home-screen, fullscreen, app title -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="USAFL Umps" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />

  <link rel="preload" href="fonts/barlow-condensed-800.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="fonts/barlow-condensed-800-italic.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="phone">
    <div id="app"></div>
    <nav id="tabbar"></nav>
  </div>
  <script src="data.js"></script>
  <script src="content.js"></script>
  <script src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
